name: Build Meera Assistant APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Project ZIP & Locate Gradle Root
        run: |
          find . -maxdepth 4 -type f -name "*.zip" -print0 | while IFS= read -r -d '' zipfile; do
            echo "Extracting: $zipfile"
            unzip -o "$zipfile"
          done
          SETTINGS_FILE=$(find . -maxdepth 5 -name "settings.gradle*" | head -n 1 || true)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Repository me 'meera-assistant.zip' ya 'settings.gradle.kts' nahi mila! Kripya repo ke Code tab me meera-assistant.zip upload karein."
            ls -la
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "Found Gradle project at: $PROJECT_DIR"
          echo "GRADLE_PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          chmod +x "$PROJECT_DIR/gradlew" 2>/dev/null || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure Android SDK & Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> $GITHUB_ENV
          echo "sdk.dir=$SDK_DIR" > "$GRADLE_PROJECT_DIR/local.properties"
          mkdir -p "$SDK_DIR/licenses"
          { echo ""; echo "24333f8a63b6825ea9c5514f83c2829b004d1fee"; } > "$SDK_DIR/licenses/android-sdk-license"
          { echo ""; echo "84831b9409646a918e30573bab4c9c91346d8abd"; } > "$SDK_DIR/licenses/android-sdk-preview-license"
          SDKMANAGER=$(find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" --sdk_root="$SDK_DIR" "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true
          fi

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle -p "$GRADLE_PROJECT_DIR" assembleDebug --stacktrace --no-daemon

      - name: Upload APK for Direct Download
        uses: actions/upload-artifact@v4
        with:
          name: Meera-Assistant-APK
          path: '**/build/outputs/apk/debug/*.apk'
